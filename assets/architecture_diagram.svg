<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a4a4a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="36" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Schrödinger Equation PINN — Architecture &amp; Training Pipeline</text>

  <!-- Input -->
  <rect x="40" y="230" width="140" height="90" rx="10" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="2"/>
  <text x="110" y="265" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Input</text>
  <text x="110" y="288" font-size="15" text-anchor="middle" fill="#333333">(x, t)</text>

  <line x1="180" y1="275" x2="230" y2="275" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Hidden layers -->
  <rect x="230" y="150" width="260" height="250" rx="10" fill="#fff4e5" stroke="#d88a1a" stroke-width="2"/>
  <text x="360" y="180" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Fully-Connected Network</text>
  <text x="360" y="204" font-size="13" text-anchor="middle" fill="#333333">6 hidden layers × 50 neurons</text>
  <text x="360" y="224" font-size="13" text-anchor="middle" fill="#333333">tanh activation</text>
  <text x="360" y="244" font-size="13" text-anchor="middle" fill="#333333">Glorot normal init</text>

  <!-- little neuron dots to suggest layers -->
  <g fill="#d88a1a" opacity="0.75">
    <circle cx="270" cy="290" r="5"/><circle cx="270" cy="310" r="5"/><circle cx="270" cy="330" r="5"/><circle cx="270" cy="350" r="5"/>
    <circle cx="320" cy="280" r="5"/><circle cx="320" cy="300" r="5"/><circle cx="320" cy="320" r="5"/><circle cx="320" cy="340" r="5"/><circle cx="320" cy="360" r="5"/>
    <circle cx="370" cy="280" r="5"/><circle cx="370" cy="300" r="5"/><circle cx="370" cy="320" r="5"/><circle cx="370" cy="340" r="5"/><circle cx="370" cy="360" r="5"/>
    <circle cx="420" cy="290" r="5"/><circle cx="420" cy="310" r="5"/><circle cx="420" cy="330" r="5"/><circle cx="420" cy="350" r="5"/>
  </g>
  <text x="360" y="382" font-size="12" text-anchor="middle" fill="#7a5410">13,002 trainable params</text>

  <line x1="490" y1="275" x2="540" y2="275" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="540" y="230" width="140" height="90" rx="10" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="2"/>
  <text x="610" y="265" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Output</text>
  <text x="610" y="288" font-size="15" text-anchor="middle" fill="#333333">(u, v)</text>

  <line x1="680" y1="275" x2="730" y2="275" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Autodiff box -->
  <rect x="730" y="180" width="200" height="190" rx="10" fill="#f1e7fb" stroke="#7c3fb0" stroke-width="2"/>
  <text x="830" y="208" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Automatic Differentiation</text>
  <text x="830" y="234" font-size="13" text-anchor="middle" fill="#333333">nested tf.GradientTape</text>
  <text x="830" y="264" font-size="13" text-anchor="middle" fill="#333333">u_t, v_t</text>
  <text x="830" y="286" font-size="13" text-anchor="middle" fill="#333333">u_xx, v_xx</text>
  <text x="830" y="316" font-size="12" text-anchor="middle" fill="#5a2680">f_u = u_t + ½v_xx</text>
  <text x="830" y="336" font-size="12" text-anchor="middle" fill="#5a2680">f_v = v_t − ½u_xx</text>

  <line x1="830" y1="370" x2="830" y2="420" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Loss boxes -->
  <rect x="610" y="430" width="150" height="70" rx="8" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
  <text x="685" y="458" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">PDE Loss</text>
  <text x="685" y="478" font-size="11" text-anchor="middle" fill="#333333">10,000 collocation pts</text>

  <rect x="770" y="430" width="150" height="70" rx="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="2"/>
  <text x="845" y="458" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Boundary Loss</text>
  <text x="845" y="478" font-size="11" text-anchor="middle" fill="#333333">400 pts, x=0,1</text>

  <rect x="930" y="430" width="150" height="70" rx="8" fill="#eaf2fb" stroke="#2471a3" stroke-width="2"/>
  <text x="1005" y="458" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Initial Loss</text>
  <text x="1005" y="478" font-size="11" text-anchor="middle" fill="#333333">400 pts, t=0</text>

  <line x1="685" y1="410" x2="685" y2="430" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="845" y1="410" x2="845" y2="430" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1005" y1="410" x2="1005" y2="430" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="685" y1="500" x2="685" y2="540" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="1005" y1="500" x2="1005" y2="540" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="685" y1="540" x2="1005" y2="540" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="845" y1="540" x2="845" y2="560" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Total loss -->
  <rect x="745" y="562" width="200" height="46" rx="8" fill="#fff8dc" stroke="#b8860b" stroke-width="2"/>
  <text x="845" y="591" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Total Loss → Adam</text>

  <!-- Backprop arrow to network -->
  <path d="M 745 585 C 500 585, 360 500, 360 400" fill="none" stroke="#999999" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="480" y="560" font-size="12" fill="#777777">backpropagation updates weights</text>
</svg>
